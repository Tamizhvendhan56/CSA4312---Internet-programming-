<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReNewMarket | Second-Hand Marketplace</title>
<style>
:root{
  --primary:#16845b;
  --primary-dark:#0d6242;
  --light:#eaf7f0;
  --dark:#172b24;
  --muted:#718078;
  --bg:#f5f8f6;
  --white:#fff;
  --border:#e3ebe6;
  --danger:#d94b4b;
  --shadow:0 8px 28px rgba(20,65,43,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
a{text-decoration:none;color:inherit}
.navbar{height:72px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 6%;box-shadow:0 2px 12px rgba(0,0,0,.04);position:sticky;top:0;z-index:20}
.logo{font-size:25px;font-weight:800;color:var(--primary)}
.logo span{color:#f0a34a}
.nav-links{display:flex;gap:25px;align-items:center}
.nav-links button{background:none;color:#53645b;font-weight:600}
.nav-links button:hover{color:var(--primary)}
.nav-actions{display:flex;gap:10px;align-items:center}
.btn{padding:11px 17px;border-radius:9px;font-weight:700;transition:.2s}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:var(--light);color:var(--primary)}
.btn-outline{background:white;border:1px solid var(--border);color:var(--dark)}
.btn-danger{background:#fff0f0;color:var(--danger)}
.btn-small{padding:7px 10px;font-size:12px;border-radius:7px}
.hero{margin:25px auto;width:88%;min-height:340px;border-radius:22px;background:linear-gradient(110deg,rgba(9,55,37,.94),rgba(15,105,68,.78)),url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=85') center/cover;display:flex;align-items:center;padding:55px;color:white}
.hero-content{max-width:580px}
.hero-tag{background:rgba(255,255,255,.16);padding:8px 13px;border-radius:30px;font-size:12px;display:inline-block;margin-bottom:18px}
.hero h1{font-size:43px;line-height:1.15;margin-bottom:16px}
.hero p{color:#e1eee7;line-height:1.7;margin-bottom:23px}
.search-area{display:flex;background:white;padding:7px;border-radius:11px;max-width:510px}
.search-area input{border:0;outline:0;flex:1;padding:10px;color:var(--dark);min-width:0}
.section{width:88%;margin:35px auto}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px}
.section-heading h2{font-size:24px}
.section-heading p{color:var(--muted);font-size:13px;margin-top:5px}
.category-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.category-card{background:white;padding:22px 12px;border-radius:14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;transition:.2s}
.category-card:hover{border-color:var(--primary);transform:translateY(-3px)}
.category-icon{font-size:30px;margin-bottom:10px}
.category-card h3{font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filters input,.filters select{padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:white;outline:none;color:var(--dark)}
.filters input{flex:1;min-width:190px}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.product-card{background:white;border-radius:15px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.product-card:hover{transform:translateY(-4px)}
.product-card img{width:100%;height:190px;object-fit:cover;background:#e8eee9}
.product-info{padding:15px}
.product-category{font-size:11px;color:var(--primary);font-weight:700;text-transform:uppercase}
.product-info h3{font-size:16px;margin:7px 0}
.product-info p{font-size:12px;color:var(--muted);line-height:1.5}
.product-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.price{font-size:19px;font-weight:800;color:var(--primary)}
.condition{font-size:11px;background:var(--light);color:var(--primary);padding:5px 8px;border-radius:20px}
.product-buttons{display:flex;gap:7px;margin-top:12px}
.product-buttons button{flex:1}
.empty{text-align:center;padding:45px 15px;color:var(--muted);background:white;border-radius:14px}
.footer{background:#122d22;color:#dce9e1;padding:35px 6%;margin-top:55px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer p{font-size:13px;color:#a9c1b3;margin-top:10px}
.page{width:88%;margin:35px auto;min-height:55vh}
.page-title{margin-bottom:25px}
.page-title h1{font-size:29px}
.page-title p{color:var(--muted);margin-top:7px;font-size:14px}
.panel{background:white;padding:22px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.panel h3{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group label{font-size:13px;font-weight:700;color:#52645a}
.form-group input,.form-group select,.form-group textarea{padding:12px;border:1px solid var(--border);border-radius:8px;outline:none;width:100%;background:white}
.form-group textarea{resize:vertical;min-height:90px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.full{grid-column:1/-1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--border);font-size:13px}
th{background:#f5f9f6;color:#52645a;font-size:12px}
.status{padding:6px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#edf5ef;color:var(--primary);display:inline-block}
.status.pending{background:#fff4df;color:#a56b0b}
.status.shipped{background:#eaf1ff;color:#4169a9}
.status.received{background:#e8f7ed;color:#16845b}
.status.cancelled{background:#fff0f0;color:#d94b4b}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat-card{background:white;padding:20px;border-radius:13px;box-shadow:var(--shadow)}
.stat-card p{font-size:12px;color:var(--muted)}
.stat-card h2{font-size:27px;margin-top:10px;color:var(--primary)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:10px 15px;border-radius:8px;background:white;color:#5d6b63;border:1px solid var(--border);font-weight:700;font-size:13px}
.tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:15px}
.modal{background:white;width:100%;max-width:520px;border-radius:17px;padding:25px;max-height:90vh;overflow:auto;position:relative}
.modal-close{position:absolute;right:18px;top:15px;background:#f0f3f1;border-radius:50%;width:30px;height:30px}
.modal h2{margin-bottom:18px;font-size:22px}
.modal .form-group{margin-bottom:13px}
.modal-actions{display:flex;gap:10px;margin-top:15px}
.modal-actions button{flex:1}
.toast{position:fixed;bottom:25px;right:25px;background:#173d2b;color:white;padding:14px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:100;font-size:13px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#e8f6ee,#f8fbf8)}
.auth-card{background:white;width:100%;max-width:430px;padding:35px;border-radius:18px;box-shadow:var(--shadow)}
.auth-card h1{font-size:27px;margin-bottom:8px}
.auth-card>p{font-size:13px;color:var(--muted);margin-bottom:22px}
.auth-card .form-group{margin-bottom:15px}
.auth-switch{text-align:center;font-size:13px;margin-top:18px;color:var(--muted)}
.auth-switch button{background:none;color:var(--primary);font-weight:700}
.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.detail-layout img{width:100%;height:370px;object-fit:cover;border-radius:15px}
.detail-info h1{font-size:28px;margin:10px 0}
.detail-info p{color:var(--muted);line-height:1.7;margin:13px 0}
.detail-info .price{font-size:27px}
.notification-item{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:15px}
.notification-item p{font-size:13px}
.notification-item small{color:var(--muted)}
@media(max-width:900px){
 .product-grid{grid-template-columns:repeat(2,1fr)}
 .category-grid{grid-template-columns:repeat(3,1fr)}
 .stats-grid{grid-template-columns:repeat(2,1fr)}
 .nav-links{display:none}
}
@media(max-width:600px){
 .navbar{padding:0 4%;height:65px}
 .logo{font-size:21px}
 .nav-actions .btn{padding:8px 10px;font-size:12px}
 .hero,.section,.page{width:92%}
 .hero{padding:30px 22px;min-height:330px}
 .hero h1{font-size:32px}
 .search-area{flex-direction:column;background:transparent;gap:7px}
 .search-area input{padding:13px;border-radius:8px}
 .category-grid{grid-template-columns:repeat(2,1fr)}
 .product-grid{grid-template-columns:1fr 1fr;gap:10px}
 .product-card img{height:135px}
 .product-info{padding:10px}
 .product-info h3{font-size:13px}
 .price{font-size:16px}
 .product-buttons{flex-direction:column}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .stats-grid{grid-template-columns:1fr 1fr}
 .detail-layout{grid-template-columns:1fr}
 .detail-layout img{height:260px}
 .section-heading h2{font-size:20px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="logo">ReNew<span>Market</span></div>
    <h1 id="authTitle">Welcome Back</h1>
    <p id="authSubtitle">Sign in to discover great pre-loved finds.</p>
    <form id="authForm">
      <div id="nameField" class="form-group hidden">
        <label>Full Name</label>
        <input id="authName" type="text" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input id="authEmail" type="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="authPassword" type="password" placeholder="Enter password" required>
      </div>
      <button class="btn btn-primary" style="width:100%" id="authSubmit">Sign In</button>
    </form>
    <div class="auth-switch">
      <span id="authSwitchText">Don't have an account?</span>
      <button onclick="toggleAuthMode()" id="authSwitchButton">Create Account</button>
    </div>
    <p style="text-align:center;margin-top:20px"><button class="btn btn-outline" onclick="continueAsGuest()">Continue as Guest</button></p>
    <p style="text-align:center;margin-top:14px"><button onclick="showHome()" style="background:none;color:var(--muted);font-size:12px">← Back to marketplace</button></p>
  </div>
</div>

<div id="app">
<header class="navbar">
  <a href="#" class="logo" onclick="showHome()">ReNew<span>Market</span></a>
  <nav class="nav-links">
    <button onclick="showHome()">Home</button>
    <button onclick="showShop()">Explore Items</button>
    <button onclick="showMyListings()">My Listings</button>
    <button onclick="showOrders()">My Orders</button>
  </nav>
  <div class="nav-actions" id="navActions"></div>
</header>

<main id="mainContent"></main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="logo" style="color:white">ReNew<span>Market</span></div>
      <p>Give pre-loved items a new life. Buy, sell and reuse.</p>
    </div>
    <div>
      <strong>Marketplace</strong>
      <p>Electronics · Furniture · Clothing · Collectibles</p>
      <p>© 2026 ReNewMarket. All rights reserved.</p>
    </div>
  </div>
</footer>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const defaultProducts = [
{id:1,title:"Wireless Bluetooth Headphones",category:"Electronics",price:1200,condition:"Like New",seller:"Arun",location:"Chennai",description:"Good quality wireless headphones with clear sound, comfortable ear cushions and long battery life. Fully working and carefully maintained.",image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",status:"Active",views:24},
{id:2,title:"Wooden Study Table",category:"Furniture",price:2500,condition:"Good",seller:"Priya",location:"Avadi",description:"Strong wooden study table with spacious surface and storage drawer. Suitable for students and home offices.",image:"https://images.unsplash.com/photo-1499933374294-4584851497cc?auto=format&fit=crop&w=800&q=80",status:"Active",views:18},
{id:3,title:"Casual Denim Jacket",category:"Clothing",price:650,condition:"Good",seller:"Karthik",location:"Chennai",description:"Comfortable denim jacket in excellent wearable condition. No major stains or damage.",image:"https://images.unsplash.com/photo-1543076447-215ad9ba6923?auto=format&fit=crop&w=800&q=80",status:"Active",views:12},
{id:4,title:"Vintage Camera",category:"Collectibles",price:3200,condition:"Used",seller:"Meena",location:"Ambattur",description:"Vintage camera for collectors and photography enthusiasts. A unique pre-loved item.",image:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80",status:"Active",views:30},
{id:5,title:"Smart Watch",category:"Electronics",price:1800,condition:"Like New",seller:"Ravi",location:"Poonamallee",description:"Smart watch with activity tracking, notifications and multiple watch faces. Fully functional.",image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80",status:"Active",views:16},
{id:6,title:"Comfortable Sofa Chair",category:"Furniture",price:4500,condition:"Good",seller:"Divya",location:"Chennai",description:"Comfortable single sofa chair suitable for living rooms and reading corners.",image:"https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?auto=format&fit=crop&w=800&q=80",status:"Active",views:11},
{id:7,title:"Travel Backpack",category:"Accessories",price:550,condition:"Good",seller:"Vijay",location:"Avadi",description:"Durable backpack with multiple compartments. Ideal for travel, college and everyday use.",image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80",status:"Active",views:9},
{id:8,title:"Decorative Wall Clock",category:"Home & Living",price:400,condition:"Like New",seller:"Anu",location:"Chennai",description:"Stylish wall clock that adds a modern look to your home. Working condition.",image:"https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?auto=format&fit=crop&w=800&q=80",status:"Active",views:14}
];

let products = JSON.parse(localStorage.getItem("renew_products")) || defaultProducts;
let users = JSON.parse(localStorage.getItem("renew_users")) || [
{id:1,name:"Administrator",email:"admin@renew.demo",password:"admin123",role:"admin"},
{id:2,name:"Demo Customer",email:"customer@renew.demo",password:"customer123",role:"customer"}
];
let orders = JSON.parse(localStorage.getItem("renew_orders")) || [];
let categories = JSON.parse(localStorage.getItem("renew_categories")) || ["Electronics","Furniture","Clothing","Collectibles","Accessories","Home & Living"];
let messages = JSON.parse(localStorage.getItem("renew_messages")) || [];
let currentUser = JSON.parse(sessionStorage.getItem("renew_current_user")) || null;
let cart = [];
let favorites = JSON.parse(localStorage.getItem("renew_favorites")) || {};
let negotiations = JSON.parse(localStorage.getItem("renew_negotiations")) || [];
let authMode = "login";
let adminTab = "dashboard";
let currentProduct = null;

function save(){
 localStorage.setItem("renew_products",JSON.stringify(products));
 localStorage.setItem("renew_users",JSON.stringify(users));
 localStorage.setItem("renew_orders",JSON.stringify(orders));
 localStorage.setItem("renew_categories",JSON.stringify(categories));
 localStorage.setItem("renew_messages",JSON.stringify(messages));
 localStorage.setItem("renew_favorites",JSON.stringify(favorites));
 localStorage.setItem("renew_negotiations",JSON.stringify(negotiations));
}
function money(n){return "₹"+Number(n).toLocaleString("en-IN")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){
 const root=document.getElementById("toastRoot");
 root.innerHTML=`<div class="toast">${esc(msg)}</div>`;
 setTimeout(()=>root.innerHTML="",2800);
}
function getUser(){return currentUser}
function isAdmin(){return currentUser?.role==="admin"}
function setUser(user){
 currentUser=user;
 if(user)sessionStorage.setItem("renew_current_user",JSON.stringify(user));
 else sessionStorage.removeItem("renew_current_user");
 renderNav();
}
function renderNav(){
 const area=document.getElementById("navActions");
 if(!area)return;
 if(!currentUser){
 area.innerHTML=`<button class="btn btn-outline" onclick="showAuth()">Sign In</button><button class="btn btn-primary" onclick="showAuth('register')">Join Free</button>`;
 }else if(isAdmin()){
 area.innerHTML=`<button class="btn btn-light" onclick="showAdmin()">Admin Panel</button><button class="btn btn-outline" onclick="logout()">Logout</button>`;
 }else{
 area.innerHTML=`<button class="btn btn-light" onclick="showFavorites()">♥ <span class="hide-mobile">Saved</span></button><button class="btn btn-light" onclick="showCart()">Cart (${cart.length})</button><button class="btn btn-outline" onclick="logout()">Logout</button>`;
 }
}
function showHome(){
 document.getElementById("authScreen").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 renderNav();
 document.getElementById("mainContent").innerHTML=`
 <section class="hero">
  <div class="hero-content">
   <span class="hero-tag">♻ A smarter way to shop sustainably</span>
   <h1>Give pre-loved items a new beginning.</h1>
   <p>Discover quality second-hand products, sell items you no longer need, and make sustainable shopping simple.</p>
   <div class="search-area">
    <input id="heroSearch" placeholder="What are you looking for?" onkeydown="if(event.key==='Enter')searchFromHero()">
    <button class="btn btn-primary" onclick="searchFromHero()">Search Items</button>
   </div>
  </div>
 </section>
 <section class="section">
  <div class="section-heading"><div><h2>Browse Categories</h2><p>Find something useful in every category.</p></div></div>
  <div class="category-grid">
   ${[
    ["📱","Electronics"],["🛋️","Furniture"],["👕","Clothing"],["🏺","Collectibles"],["🎒","Accessories"]
   ].map(c=>`<div class="category-card" onclick="showShop('${c[1]}')"><div class="category-icon">${c[0]}</div><h3>${c[1]}</h3></div>`).join("")}
  </div>
 </section>
 <section class="section">
  <div class="section-heading"><div><h2>Recently Listed</h2><p>Explore popular pre-loved products.</p></div><button class="btn btn-light" onclick="showShop()">View All →</button></div>
  <div class="product-grid">${products.filter(p=>p.status==="Active").slice(0,4).map(productCard).join("")}</div>
 </section>
 <section class="section">
  <div class="panel" style="background:var(--light);box-shadow:none;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
   <div><h2 style="color:var(--primary-dark)">Have something to sell?</h2><p style="margin-top:8px;color:#567264">List your pre-loved items and connect with interested buyers.</p></div>
   <button class="btn btn-primary" onclick="startSelling()">Create a Listing</button>
  </div>
 </section>`;
}
function searchFromHero(){
 const q=document.getElementById("heroSearch").value;
 showShop();
 const input=document.getElementById("shopSearch");
 if(input){input.value=q;renderProducts()}
}
function showShop(category=""){
 document.getElementById("authScreen").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 renderNav();
 document.getElementById("mainContent").innerHTML=`
 <div class="page">
  <div class="page-title"><h1>Explore Marketplace</h1><p>Find quality second-hand products at great prices.</p></div>
  <div class="filters">
   <input id="shopSearch" placeholder="Search products..." oninput="renderProducts()">
   <select id="categoryFilter" onchange="renderProducts()"><option value="">All Categories</option>${categories.map(c=>`<option ${c===category?"selected":""}>${esc(c)}</option>`).join("")}</select>
   <select id="conditionFilter" onchange="renderProducts()"><option value="">Any Condition</option><option>Like New</option><option>Good</option><option>Used</option></select>
   <select id="sortFilter" onchange="renderProducts()"><option value="new">Recently Listed</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
  </div>
  <div id="productResults" class="product-grid"></div>
 </div>`;
 renderProducts();
}
function renderProducts(){
 const root=document.getElementById("productResults");
 if(!root)return;
 const q=(document.getElementById("shopSearch")?.value||"").toLowerCase();
 const cat=document.getElementById("categoryFilter")?.value||"";
 const cond=document.getElementById("conditionFilter")?.value||"";
 const sort=document.getElementById("sortFilter")?.value||"new";
 let list=products.filter(p=>p.status==="Active"&&
  (!q||(p.title+" "+p.description+" "+p.category+" "+p.location).toLowerCase().includes(q))&&
  (!cat||p.category===cat)&&(!cond||p.condition===cond));
 if(sort==="low")list.sort((a,b)=>a.price-b.price);
 if(sort==="high")list.sort((a,b)=>b.price-a.price);
 if(!list.length){root.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>No products found</h3><p style="margin-top:8px">Try changing your search or filters.</p></div>`;return}
 root.innerHTML=list.map(productCard).join("");
}
function productCard(p){
 return `<div class="product-card">
  <img src="${esc(p.image)}" alt="${esc(p.title)}" onerror="this.src='https://placehold.co/600x400?text=ReNewMarket'">
  <div class="product-info">
   <span class="product-category">${esc(p.category)}</span>
   <h3>${esc(p.title)}</h3>
   <p>📍 ${esc(p.location||"Location not specified")} · ${esc(p.condition)}</p>
   <div class="product-bottom"><span class="price">${money(p.price)}</span><span class="condition">${esc(p.condition)}</span></div>
   <div class="product-buttons">
    <button class="btn btn-primary btn-small" onclick="viewProduct(${p.id})">View Details</button>
    <button class="btn btn-outline btn-small" onclick="toggleFavorite(${p.id})">♥</button>
   </div>
  </div>
 </div>`;
}
function viewProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 currentProduct=p;
 p.views=(p.views||0)+1;save();
 document.getElementById("mainContent").innerHTML=`

function changeOrderStatus(id,status){
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 if(status==="Cancelled"&&o.status!=="Cancelled"){
  o.items.forEach(i=>{const p=products.find(x=>x.id===i.id);if(p)p.status="Active"});
 }
 if(o.status==="Cancelled"&&status!=="Cancelled"){
  o.items.forEach(i=>{const p=products.find(x=>x.id===i.id);if(p)p.status="Sold"});
 }
 o.status=status;
 messages.push({userId:o.userId,text:`Your order ${o.id} status has been updated to ${status}.`,date:new Date().toLocaleString()});
 save();renderAdmin();toast("Order status updated");
}

function saveUser(e,id){
 e.preventDefault();
 const name=document.getElementById("userName").value.trim();
 const email=document.getElementById("userEmail").value.trim().toLowerCase();
 const password=document.getElementById("userPassword").value;
 const role=document.getElementById("userRole").value;
 if(users.some(u=>u.email===email&&u.id!==id))return toast("Email already exists");
 if(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  u.name=name;u.email=email;u.role=role;if(password)u.password=password;
 }else users.push({id:Date.now(),name,email,password,role});
 save();closeModal();renderAdmin();toast("User information saved");
}
function deleteUser(id){

 if(!confirm("Delete this user account?"))return;
 users=users.filter(u=>u.id!==id);save();renderAdmin();toast("User deleted");
}
function addCategory(){
 const name=prompt("Enter new category name:");
 if(!name||!name.trim())return;
 if(categories.some(c=>c.toLowerCase()===name.trim().toLowerCase()))return toast("Category already exists");
 categories.push(name.trim());save();renderAdmin();toast("Category added");
}
function deleteCategory(name){
 if(products.some(p=>p.category===name))return toast("Cannot delete a category that contains products");
 if(!confirm("Delete category "+name+"?"))return;
 categories=categories.filter(c=>c!==name);save();renderAdmin();toast("Category deleted");
}
function openAdminProductModal(id=null){
 const p=id?products.find(x=>x.id===id):{};
 document.getElementById("modalRoot").innerHTML=`
 <div class="modal-bg"><div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><h2>${id?"Edit Commodity":"Add Commodity"}</h2>
 <form onsubmit="saveAdminProduct(event,${id||"null"})">
 <div class="form-group"><label>Commodity Name</label><input id="apTitle" required value="${esc(p.title||"")}"></div>
 <div class="form-grid">
 <div class="form-group"><label>Category</label><select id="apCategory">${categories.map(c=>`<option ${p.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <div class="form-group"><label>Price</label><input id="apPrice" type="number" min="1" required value="${p.price||""}"></div>
 <div class="form-group"><label>Condition</label><select id="apCondition"><option ${p.condition==="Like New"?"selected":""}>Like New</option><option ${p.condition==="Good"?"selected":""}>Good</option><option ${p.condition==="Used"?"selected":""}>Used</option></select></div>
 <div class="form-group"><label>Seller</label><input id="apSeller" required value="${esc(p.seller||"Administrator")}"></div>
 </div>
 <div class="form-group"><label>Image URL</label><input id="apImage" value="${esc(p.image||"")}"></div>
 <div class="form-group"><label>Description</label><textarea id="apDescription" required>${esc(p.description||"")}</textarea></div>
 <div class="form-group"><label>Status</label><select id="apStatus"><option ${p.status==="Active"?"selected":""}>Active</option><option ${p.status==="Sold"?"selected":""}>Sold</option></select></div>
 <button class="btn btn-primary" style="width:100%">Save Commodity</button>
 </form></div></div>`;
}
function saveAdminProduct(e,id){
 e.preventDefault();
 const data={title:document.getElementById("apTitle").value.trim(),category:document.getElementById("apCategory").value,price:Number(document.getElementById("apPrice").value),condition:document.getElementById("apCondition").value,seller:document.getElementById("apSeller").value.trim(),image:document.getElementById("apImage").value.trim()||"https://placehold.co/600x400?text=ReNewMarket",description:document.getElementById("apDescription").value.trim(),status:document.getElementById("apStatus").value};
 if(id){Object.assign(products.find(p=>p.id===id),data)}
 else products.unshift({id:Date.now(),...data,views:0});
 save();closeModal();renderAdmin();toast("Commodity saved successfully");
}
function adminDeleteProduct(id){
 if(!confirm("Delete this commodity?"))return;
 products=products.filter(p=>p.id!==id);save();renderAdmin();toast("Commodity deleted");
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function showHomeAndTop(){showHome();window.scrollTo(0,0)}
renderNav();
if(currentUser?.role==="admin")showAdmin();else showHome();
</script>
</body>
</html>
